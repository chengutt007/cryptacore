services:
  - type: web
    name: cryptacore-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./crypta_v2.db
      - key: SECRET_KEY
        value: crypta_v2_ultra_secret
      - key: MODEL_PATH
        value: ../ml/saved_models
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://cryptacore-ai.vercel.app,http://localhost:5173
    disk:
      name: crypta-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
