version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: crypta_postgres
    restart: always
    environment:
      POSTGRES_USER: crypta
      POSTGRES_PASSWORD: crypta_secret
      POSTGRES_DB: cryptacoreai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypta -d cryptacoreai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crypta_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://crypta:crypta_secret@db:5432/cryptacoreai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/saved_models:/app/ml/saved_models

volumes:
  pgdata:
